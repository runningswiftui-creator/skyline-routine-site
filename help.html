<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>User Guide — Skyline Routine</title>
    <meta name="description" content="Skyline Routine quick user guide." />
    <link rel="icon" href="assets/icon.png" />
    <link rel="stylesheet" href="styles.css" />
    <style>
      .help-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 26px; }
      .help-card { padding: 20px; border: 1px solid rgba(120, 195, 220, .16); border-radius: 18px; background: rgba(8, 24, 38, .55); }
      .help-card h2 { margin: 0 0 8px; font-size: 17px; }
      .help-card p { margin: 0; color: var(--muted); line-height: 1.75; }
      .help-footer { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 26px; }
      @media (max-width: 640px) { .help-grid { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="wrap header-inner">
        <a class="brand" href="index.html"><img src="assets/icon.png" alt="" width="34" height="34" /><span>SKYLINE <b>ROUTINE</b></span></a>
        <nav class="site-nav" aria-label="Help navigation">
          <a href="index.html">Skyline Routine</a>
          <a href="en.html">English</a>
          <a href="zh.html">中文</a>
        </nav>
      </div>
    </header>
    <main class="wrap legal-page">
      <a class="back-link" id="helpBack" href="index.html">← Back</a>
      <p class="eyebrow">USER GUIDE</p>
      <h1 id="helpTitle">使用指南</h1>
      <p id="helpIntro"></p>
      <div class="help-grid" id="helpGrid"></div>
      <div class="help-footer">
        <a class="btn btn-primary" id="helpGuide" href="downloads/Skyline-Routine-User-Guide-en-US.pdf"></a>
        <a class="btn btn-ghost" href="mailto:runningswiftui@gmail.com">runningswiftui@gmail.com</a>
      </div>
    </main>
    <script>
      const HELP = {
        'zh-CN': { title:'使用指南', intro:'Skyline Routine 会在设定时间让飞机起飞并持续巡航，点击飞机或提醒内容即可结束。', back:'返回', guide:'完整使用说明', cards:[
          ['快速开始','新建提醒，填写内容和时间，保存后保持应用运行。到点后飞机会出现在屏幕上。'],
          ['暂停提醒','可选择会议 30/60 分钟或暂停 1 小时。首页会显示剩余倒计时，恢复前需要确认。'],
          ['飞行区域','可选择全屏、四个四分之一区域或拖动自定义区域；每条提醒也可以单独覆盖。'],
          ['鼠标避让','默认关闭。开启后可选择近、中、远距离，飞机和卡片会整体避让鼠标。'],
          ['降落','只有飞机完全飞出屏幕后才会在屏幕外降落；降落后底部提示约 5 秒。'],
          ['本地数据','提醒只保存在本机。可以保存分享卡片，也可以导出/导入提醒备份。']
        ]},
        'zh-TW': { title:'使用指南', intro:'Skyline Routine 會在設定時間讓飛機起飛並持續巡航，點擊飛機或提醒內容即可結束。', back:'返回', guide:'完整使用說明', cards:[
          ['快速開始','新增提醒，填寫內容和時間，儲存後保持應用程式執行。到時飛機會出現在螢幕上。'],
          ['暫停提醒','可選擇會議 30/60 分鐘或暫停 1 小時。首頁會顯示剩餘倒數，恢復前需要確認。'],
          ['飛行區域','可選擇全螢幕、四個四分之一區域或拖動自訂區域；每條提醒也可以單獨覆寫。'],
          ['滑鼠避讓','預設關閉。開啟後可選擇近、中、遠距離，飛機和卡片會整體避讓滑鼠。'],
          ['降落','只有飛機完全飛出螢幕後才會在螢幕外降落；降落後底部提示約 5 秒。'],
          ['本機資料','提醒只保存在本機。可以儲存分享卡片，也可以匯出/匯入提醒備份。']
        ]},
        'en-US': { title:'User guide', intro:'Skyline Routine sends a plane across your screen at the scheduled time. Click the plane or reminder text to end the flight.', back:'Back', guide:'Full user guide', cards:[
          ['Quick start','Create a reminder, choose a time and repeat mode, save it, and keep the app running. The flight appears when due.'],
          ['Pause reminders','Use Meeting 30/60 minutes or Pause. The main page shows the countdown, and resuming asks for confirmation.'],
          ['Flight area','Choose full screen, one of the four quarters, or a drag-to-resize custom area. Each reminder can override the default.'],
          ['Cursor avoidance','Off by default. Choose near, medium, or far distance to make the aircraft and card avoid the pointer together.'],
          ['Landing','The aircraft lands outside only after it has completely left the screen. The main page shows a short 5-second notice.'],
          ['Local data','Reminders stay on your Mac. You can save a share card and export or import a reminder backup.']

        'ja-JP': { title:'使い方', intro:'Skyline Routine は設定した時刻に飛行機を飛ばし、クリックするまで画面上を巡航します。', back:'戻る', guide:'詳しい使い方', cards:[

          ['飛行エリア','全画面、4分割、ドラッグで調整するカスタムエリアから選べます。リマインダーごとの設定も可能です。'],
          ['カーソル回避','初期設定はオフです。近・中・遠の距離を選ぶと、飛行機とカードが一緒にカーソルを避けます。'],
          ['着陸','飛行機が完全に画面外に出た場合のみ画面外に着陸し、メイン画面に約5秒の通知を表示します。'],
          ['ローカルデータ','リマインダーは Mac 内に保存されます。共有カードの保存、バックアップの書き出し・読み込みができます。']

        'ko-KR': { title:'사용 방법', intro:'Skyline Routine은 설정한 시간에 비행기를 띄우고, 클릭할 때까지 화면을 순항합니다.', back:'뒤로', guide:'전체 사용 설명서', cards:[
          ['빠른 시작','알림을 만들고 시간과 반복을 설정한 뒤 저장하세요. 앱은 실행 상태로 두세요.'],
          ['알림 일시정지','회의 30/60분 또는 1시간 일시정지를 선택할 수 있습니다. 남은 시간이 표시되고 재개 시 확인합니다.'],
          ['비행 영역','전체 화면, 4분할, 드래그로 조정하는 사용자 영역을 선택할 수 있습니다. 알림별로 설정할 수도 있습니다.'],
          ['커서 회피','기본값은 꺼짐입니다. 가까움/보통/멀리를 선택하면 비행기와 카드가 함께 커서를 피합니다.'],
          ['착륙','비행기가 화면 밖으로 완전히 나간 경우에만 화면 밖에 착륙하며, 메인 화면에 약 5초 알림을 표시합니다.'],
          ['로컬 데이터','알림은 Mac에만 저장됩니다. 공유 카드를 저장하고 알림 백업을 내보내거나 가져올 수 있습니다.']
        ]},
        'es-ES': { title:'Guía de uso', intro:'Skyline Routine hace despegar un avión a la hora programada y lo mantiene en vuelo hasta que lo confirmes.', back:'Volver', guide:'Guía completa', cards:[
          ['Inicio rápido','Crea un recordatorio, elige hora y repetición, guárdalo y mantén la app abierta. El vuelo aparecerá a su hora.'],
          ['Pausar recordatorios','Elige Reunión 30/60 minutos o Pausa. La página principal muestra la cuenta atrás y pide confirmación al reanudar.'],
          ['Zona de vuelo','Elige pantalla completa, uno de los cuatro cuartos o una zona personalizada arrastrable. Cada recordatorio puede cambiarla.'],
          ['Evitar el cursor','Desactivado por defecto. Elige cerca, medio o lejos para que el avión y la tarjeta eviten juntos el puntero.'],
          ['Aterrizaje','Solo aterriza fuera de la pantalla cuando el avión ha salido por completo; la página principal muestra un aviso de 5 segundos.'],
          ['Datos locales','Los recordatorios se guardan en tu Mac. Puedes guardar una tarjeta para compartir y exportar o importar una copia.']
        ]},
        'fr-FR': { title:'Guide d’utilisation', intro:'Skyline Routine fait décoller un avion à l’heure prévue et le fait voler jusqu’à votre confirmation.', back:'Retour', guide:'Guide complet', cards:[
          ['Démarrage rapide','Créez un rappel, choisissez l’heure et la répétition, enregistrez-le et gardez l’app ouverte. Le vol apparaîtra à l’heure.'],
          ['Mettre en pause','Choisissez Réunion 30/60 minutes ou Pause. La page principale affiche le compte à rebours et demande confirmation avant de reprendre.'],
          ['Zone de vol','Choisissez l’écran complet, un des quatre quarts ou une zone personnalisée à redimensionner. Chaque rappel peut la remplacer.'],
          ['Éviter le curseur','Désactivé par défaut. Choisissez près, moyen ou loin pour que l’avion et la carte évitent ensemble le pointeur.'],
          ['Atterrissage','L’avion n’atterrit hors écran qu’après être complètement sorti ; la page principale affiche un avis de 5 secondes.'],
          ['Données locales','Les rappels restent sur votre Mac. Vous pouvez enregistrer une carte de partage et exporter ou importer une sauvegarde.']
        ]},
        'de-DE': { title:'Anleitung', intro:'Skyline Routine lässt ein Flugzeug zur geplanten Zeit starten und fliegt weiter, bis du es bestätigst.', back:'Zurück', guide:'Vollständige Anleitung', cards:[
          ['Schnellstart','Erstelle eine Erinnerung, wähle Zeit und Wiederholung, speichere sie und lasse die App laufen. Der Flug erscheint zur richtigen Zeit.'],
          ['Erinnerungen pausieren','Wähle Meeting 30/60 Minuten oder Pause. Die Hauptseite zeigt den Countdown und fragt vor dem Fortsetzen nach.'],
          ['Flugbereich','Wähle Vollbild, ein Viertel oder einen ziehbaren eigenen Bereich. Jede Erinnerung kann den Standard überschreiben.'],
          ['Cursor ausweichen','Standardmäßig aus. Wähle nah, mittel oder weit, damit Flugzeug und Karte gemeinsam dem Zeiger ausweichen.'],
          ['Landung','Das Flugzeug landet nur außerhalb des Bildschirms, wenn es ihn vollständig verlassen hat; die Hauptseite zeigt 5 Sekunden lang einen Hinweis.'],
          ['Lokale Daten','Erinnerungen bleiben auf deinem Mac. Du kannst eine Teilen-Karte speichern und eine Sicherung exportieren oder importieren.']
        ]},
        'it-IT': { title:'Guida all’uso', intro:'Skyline Routine fa decollare un aereo all’orario scelto e lo mantiene in volo finché non lo confermi.', back:'Indietro', guide:'Guida completa', cards:[
          ['Avvio rapido','Crea un promemoria, scegli orario e ripetizione, salvalo e lascia l’app aperta. Il volo appare all’orario previsto.'],
          ['Sospendere i promemoria','Scegli Riunione 30/60 minuti o Pausa. La pagina principale mostra il conto alla rovescia e chiede conferma prima di riprendere.'],
          ['Area di volo','Scegli schermo intero, un quarto o un’area personalizzata ridimensionabile. Ogni promemoria può sovrascriverla.'],
          ['Evita il cursore','Disattivato per impostazione predefinita. Scegli vicino, medio o lontano per far evitare insieme aereo e scheda il puntatore.'],
          ['Atterraggio','L’aereo atterra fuori schermo solo dopo essere uscito completamente; la pagina principale mostra un avviso di 5 secondi.'],
          ['Dati locali','I promemoria restano sul Mac. Puoi salvare una scheda da condividere ed esportare o importare un backup.']
        ]},
        'nl-NL': { title:'Gebruikershandleiding', intro:'Skyline Routine laat op de ingestelde tijd een vliegtuig opstijgen en blijft vliegen tot je bevestigt.', back:'Terug', guide:'Volledige handleiding', cards:[
          ['Snel starten','Maak een herinnering, kies tijd en herhaling, sla op en laat de app draaien. Het vliegtuig verschijnt op tijd.'],
          ['Herinneringen pauzeren','Kies Vergadering 30/60 minuten of Pauze. De hoofdpagina toont de aftelling en vraagt om bevestiging bij hervatten.'],
          ['Vlieggebied','Kies volledig scherm, een kwart of een sleepbaar eigen gebied. Elke herinnering kan de standaard overschrijven.'],
          ['Cursor ontwijken','Standaard uit. Kies dichtbij, gemiddeld of ver om vliegtuig en kaart samen de cursor te laten ontwijken.'],
          ['Landing','Het vliegtuig landt alleen buiten het scherm nadat het volledig is verdwenen; de hoofdpagina toont 5 seconden een melding.'],
          ['Lokale gegevens','Herinneringen blijven op je Mac. Je kunt een deelkaart opslaan en een back-up exporteren of importeren.']
        ]},
        'sv-SE': { title:'Användarguide', intro:'Skyline Routine skickar upp ett flygplan vid vald tid och fortsätter flyga tills du bekräftar.', back:'Tillbaka', guide:'Fullständig guide', cards:[
          ['Snabbstart','Skapa en påminnelse, välj tid och upprepning, spara och låt appen köra. Flygplanet visas vid rätt tid.'],
          ['Pausa påminnelser','Välj Möte 30/60 minuter eller Paus. Huvudsidan visar nedräkningen och frågar innan den återupptas.'],
          ['Flygområde','Välj helskärm, en fjärdedel eller ett eget område som du drar i. Varje påminnelse kan åsidosätta standarden.'],
          ['Undvik markören','Av som standard. Välj nära, medel eller långt för att flygplan och kort tillsammans ska undvika pekaren.'],
          ['Landning','Flygplanet landar utanför skärmen först när det helt har lämnat den; huvudsidan visar en 5-sekunders notis.'],
          ['Lokal data','Påminnelser stannar på din Mac. Du kan spara ett delningskort och exportera eller importera en säkerhetskopia.']
        ]}
      };
      const params = new URLSearchParams(location.search);
      const requested = params.get('lang') || navigator.language || 'en-US';
      const helpKeys = Object.keys(HELP);
      const helpKey = helpKeys.find((key) => key.toLowerCase() === requested.toLowerCase()) || helpKeys.find((key) => key.split('-')[0] === requested.split('-')[0]) || 'en-US';
      const data = HELP[helpKey];
      document.documentElement.lang = helpKey;
      document.title = data.title + ' — Skyline Routine';
      document.getElementById('helpBack').textContent = '← ' + data.back;
      document.getElementById('helpTitle').textContent = data.title;
      document.getElementById('helpIntro').textContent = data.intro;
      document.getElementById('helpGuide').textContent = data.guide;
      document.getElementById('helpGuide').href = 'guide.html?lang=' + encodeURIComponent(helpKey);
      document.getElementById('helpGrid').innerHTML = data.cards.map(([title, body]) =>
        '<section class="help-card"><h2>' + title + '</h2><p>' + body + '</p></section>'
      ).join('');
    </script>
    <script src="site.js"></script>
  </body>
</html>
